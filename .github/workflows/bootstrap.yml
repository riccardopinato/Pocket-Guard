name: Bootstrap Pocket Guard source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 > /tmp/pocket-guard-source.b64
          base64 -d /tmp/pocket-guard-source.b64 > /tmp/pocket-guard-source.zip
          unzip -oq /tmp/pocket-guard-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap Pocket Guard v0.3 source"
          git push origin HEAD:main
