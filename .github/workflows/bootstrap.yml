name: Bootstrap Pocket Guard source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".bootstrap/trigger"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00.b64 .bootstrap/part01.b64 .bootstrap/part02.b64 .bootstrap/part03.b64 .bootstrap/part04.b64 .bootstrap/part05.b64 .bootstrap/part06_*.b64 > /tmp/pocket-guard-source.b64
          test "$(wc -c < /tmp/pocket-guard-source.b64)" -eq 75396
          base64 -d /tmp/pocket-guard-source.b64 > /tmp/pocket-guard-source.zip
          unzip -oq /tmp/pocket-guard-source.zip -d . || true
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/riccardopinato/pocketguard/service/PocketGuardService.kt
          rm -rf .bootstrap
          rm -rf .github/workflows
          mkdir -p .github/workflows

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap Pocket Guard v0.3 source"
          git push origin HEAD:main
